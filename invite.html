<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Party?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-deep:#160f2e;
    --sky-mid:#2c2059;
    --sky-violet:#4a3789;
    --gold:#e8b94d;
    --blush:#f0a3b8;
    --cream:#fbf3e6;
    --cream-dim:#cfc4e6;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:linear-gradient(180deg,var(--sky-deep) 0%, var(--sky-mid) 55%, var(--sky-violet) 100%);
    font-family:'Quicksand',sans-serif;
    color:var(--cream);
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  #stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .star{
    position:absolute;
    background:var(--cream);
    border-radius:50%;
    opacity:0.7;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(0.8);}
    50%{opacity:1; transform:scale(1.2);}
  }

  .wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem 1.5rem;
  }

  .eyebrow{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:0.7rem;
    color:var(--gold);
    margin-bottom:1.4rem;
    font-weight:600;
    opacity:0;
    animation:fadeUp 1s ease forwards 0.2s;
  }

  .dream-word{
    font-family:'Dancing Script', cursive;
    font-size:clamp(2.6rem, 9vw, 5.5rem);
    color:var(--gold);
    line-height:1;
    text-shadow:0 0 30px rgba(232,185,77,0.45);
    opacity:0;
    animation:fadeUp 1.2s ease forwards 0.5s;
    margin-bottom:0.5rem;
  }

  .headline{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.3rem, 3.4vw, 1.9rem);
    color:var(--cream-dim);
    opacity:0;
    animation:fadeUp 1.2s ease forwards 0.9s;
    margin-bottom:3rem;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* Floating "click me" button before the question appears */
  #clickMeBtn{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--sky-deep);
    background:linear-gradient(135deg, var(--gold), var(--blush));
    border:none;
    padding:1.1rem 2.6rem;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(232,185,77,0.35);
    opacity:0;
    animation:fadeUp 1.2s ease forwards 1.3s, float 3s ease-in-out infinite 2.5s;
  }
  #clickMeBtn:focus-visible{
    outline:3px solid var(--cream);
    outline-offset:3px;
  }

  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }

  /* The question panel, hidden until clickMeBtn is pressed */
  #question{
    display:none;
    flex-direction:column;
    align-items:center;
  }
  #question.show{
    display:flex;
    animation:fadeUp 0.7s ease forwards;
  }

  .ask{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    color:var(--cream);
    margin-bottom:2.4rem;
  }
  .ask strong{
    font-style:normal;
    font-weight:700;
    color:var(--blush);
  }

  .options{
    display:flex;
    gap:1.6rem;
    flex-wrap:wrap;
    justify-content:center;
    position:relative;
    min-height:70px;
    width:100%;
  }

  .opt-btn{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:1rem;
    padding:0.9rem 2.2rem;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform 0.2s ease, box-shadow 0.2s ease;
  }

  #yesBtn{
    color:var(--sky-deep);
    background:linear-gradient(135deg, var(--gold), var(--blush));
    box-shadow:0 8px 24px rgba(232,185,77,0.35);
  }
  #yesBtn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(232,185,77,0.45);
  }

  #noBtn{
    color:var(--cream);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(240,163,184,0.4);
    position:relative;
  }
  #noBtn.dodging{
    position:fixed;
    z-index:10;
    transition:top 0.18s ease, left 0.18s ease;
  }

  .hint{
    margin-top:2.6rem;
    font-size:0.85rem;
    color:var(--cream-dim);
    opacity:0;
    animation:fadeUp 1s ease forwards;
    animation-delay:0.3s;
  }
</style>
</head>
<body>

<div id="stars" aria-hidden="true"></div>

<div class="wrap">
  <div class="eyebrow">just a little something</div>
  <div class="dream-word">Hey you</div>
  <h1 class="headline">before anything else, I have a question</h1>

  <button id="clickMeBtn">Click me ✨</button>

  <div id="question">
    <p class="ask">So... will you <strong>give</strong> me party? </p>
    <div class="options">
      <button id="yesBtn" class="opt-btn">Yes 🎉</button>
      <button id="noBtn" class="opt-btn">No</button>
    </div>
    <p class="hint" id="hint" style="display:none;">that's what I thought 😉</p>
  </div>
</div>

<script>
  // Twinkling stars
  const starsContainer = document.getElementById('stars');
  for(let i=0;i<90;i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2.2+1;
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.top=Math.random()*100+'%';
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*3.5)+'s';
    s.style.animationDuration=(2.5+Math.random()*3)+'s';
    starsContainer.appendChild(s);
  }

  const clickMeBtn = document.getElementById('clickMeBtn');
  const question = document.getElementById('question');
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const hint = document.getElementById('hint');

  clickMeBtn.addEventListener('click', ()=>{
    clickMeBtn.style.display = 'none';
    question.classList.add('show');
  });

  // "Yes" brings the guest to the balloons page
  yesBtn.addEventListener('click', ()=>{
    window.location.href = 'balloons.html';
  });

  // "No" floats/dodges away whenever it's approached or clicked
  function dodge(){
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;
    const margin = 30;
    const minX = margin;
    const maxX = window.innerWidth - btnWidth - margin;
    const minY = margin;
    const maxY = window.innerHeight - btnHeight - margin;

    // Ensure valid range
    const safeMaxX = Math.max(minX + 10, maxX);
    const safeMaxY = Math.max(minY + 10, maxY);

    const newLeft = Math.random()*(safeMaxX-minX)+minX;
    const newTop = Math.random()*(safeMaxY-minY)+minY;

    if(!noBtn.classList.contains('dodging')){
      const rect = noBtn.getBoundingClientRect();
      noBtn.style.left = rect.left+'px';
      noBtn.style.top = rect.top+'px';
      noBtn.classList.add('dodging');
      // force reflow so the transition applies to the next move
      noBtn.offsetHeight;
    }

    noBtn.style.left = Math.round(newLeft)+'px';
    noBtn.style.top = Math.round(newTop)+'px';
    hint.style.display = 'block';
  }

  // Dodge on hover (desktop) and on touch/click (mobile + fallback)
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    dodge();
  });
  noBtn.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    dodge();
  });
</script>

</body>
</html>
